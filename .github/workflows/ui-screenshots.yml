name: UI-screenshots (tijdelijk)

# Alleen op de werkbranch voor het redesign: bouwt de debug-APK, start een nagebootste
# timer en maakt op een emulator screenshots van alle schermen. Resultaat: branch ui-shots.

on:
  push:
    branches: [ui-redesign]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug-APK bouwen
        id: build
        continue-on-error: true
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee ../build.log

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nep-ESP starten
        if: steps.build.outcome == 'success'
        run: |
          pip install websockets
          sudo -E "$(which python)" ui-test/fake_esp.py 81 > esp.log 2>&1 &
          sleep 2; cat esp.log

      - name: KVM aanzetten
        if: steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator en screenshots
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ui-test/run.sh 2>&1 | tee run.log

      - name: Resultaat naar branch ui-shots
        if: always()
        run: |
          mkdir -p /tmp/pub/shots
          cp -r shots/* /tmp/pub/shots/ 2>/dev/null || true
          cp build.log run.log esp.log /tmp/pub/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/pub/commit.txt
          cd /tmp/pub
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b ui-shots
          git add -A
          git commit -qm "Screenshots ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ui-shots
